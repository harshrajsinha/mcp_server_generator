<VirtualHost *:80>
    ServerName damac.scikiq.org
    DocumentRoot /var/www/html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Redirect to HTTPS
    RewriteEngine On
    RewriteCond %{HTTPS} off
    RewriteRule ^(.*)$ https://%{HTTP_HOST}$1 [R=301,L]

    ErrorLog ${APACHE_LOG_DIR}/damac_scikiq_error.log
    CustomLog ${APACHE_LOG_DIR}/damac_scikiq_access.log combined
</VirtualHost>
