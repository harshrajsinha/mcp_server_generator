<VirtualHost *:80>
    ServerName app.scikiq.org
    DocumentRoot /var/www/html

    DirectoryIndex services.html

    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/app_scikiq_error.log
    CustomLog ${APACHE_LOG_DIR}/app_scikiq_access.log combined
</VirtualHost>
