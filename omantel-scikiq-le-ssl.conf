<IfModule mod_ssl.c>
<VirtualHost *:443>
    ServerName omantel.scikiq.org
    DocumentRoot /var/www/html

    # Serve static files from /var/www/html
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Proxy everything to port 30201
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:30201/
    ProxyPassReverse / http://127.0.0.1:30201/

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:30201/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/omantel_scikiq_error.log
    CustomLog ${APACHE_LOG_DIR}/omantel_scikiq_access.log combined

    SSLCertificateFile /etc/letsencrypt/live/omantel.scikiq.org/fullchain.pem
    SSLCertificateKeyFile /etc/letsencrypt/live/omantel.scikiq.org/privkey.pem
    Include /etc/letsencrypt/options-ssl-apache.conf
</VirtualHost>
</IfModule>
