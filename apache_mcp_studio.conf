<VirtualHost *:80>
    ServerName tools.scikiq.org
    DocumentRoot /var/www/html

    # Serve static files from /var/www/html
    <Directory /var/www/html>
        Options Indexes FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    # Serve services.html and other static files directly
    ProxyPass /services.html !
    ProxyPass /index.html !

    # Proxy everything else to MCP Studio
    ProxyPreserveHost On
    ProxyPass / http://127.0.0.1:30211/
    ProxyPassReverse / http://127.0.0.1:30211/

    # WebSocket support
    RewriteEngine On
    RewriteCond %{HTTP:Upgrade} websocket [NC]
    RewriteCond %{HTTP:Connection} upgrade [NC]
    RewriteRule ^/?(.*) ws://127.0.0.1:30211/$1 [P,L]

    ErrorLog ${APACHE_LOG_DIR}/mcp_studio_error.log
    CustomLog ${APACHE_LOG_DIR}/mcp_studio_access.log combined
</VirtualHost>
